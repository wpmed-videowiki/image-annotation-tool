version: "3"
services:
  image-annotation-tool:
    image: image-annotation-tool:latest
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      VIDEO_TMP_DIR: /video-tmp
    volumes:
      - video-tmp:/video-tmp
  image-annotation-tool-worker:
    image: image-annotation-tool:latest
    command: npm run start:worker
    restart: unless-stopped
  image-annotation-tool-video-worker:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    image: image-annotation-tool-video-worker:latest
    restart: unless-stopped
    environment:
      VIDEO_TMP_DIR: /video-tmp
      # bare node does not set NODE_ENV, so force structured log output
      LOG_FORMAT: json
    volumes:
      - video-tmp:/video-tmp
  mongodb:
    image: mongo:4.4.1
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data:/data/db
  rabbitmq:
    image: rabbitmq:3.8.9-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

volumes:
  video-tmp:
